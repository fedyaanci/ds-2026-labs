services:
  redis-main:
    image: redis:7-alpine
    ports:
      - "6000:6379"
    healthcheck: &redis-health
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-ru:
    image: redis:7-alpine
    ports:
      - "6001:6379"
    healthcheck: *redis-health

  redis-eu:
    image: redis:7-alpine
    ports:
      - "6002:6379"
    healthcheck: *redis-health

  redis-asia:
    image: redis:7-alpine
    ports:
      - "6003:6379"
    healthcheck: *redis-health

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  valuator-1:
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    environment: &valuator-environment
      DB_MAIN: redis-main:6379
      DB_RU: redis-ru:6379
      DB_EU: redis-eu:6379
      DB_ASIA: redis-asia:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: lab
      RabbitMq__Password: lab
    ports:
      - "5001:8080"
    depends_on: &application-dependencies
      redis-main:
        condition: service_healthy
      redis-ru:
        condition: service_healthy
      redis-eu:
        condition: service_healthy
      redis-asia:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  valuator-2:
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    environment: *valuator-environment
    ports:
      - "5002:8080"
    depends_on: *application-dependencies

  rank-calculator-1:
    build:
      context: .
      dockerfile: RankCalculator/Dockerfile
    environment: &rank-environment
      DB_MAIN: redis-main:6379
      DB_RU: redis-ru:6379
      DB_EU: redis-eu:6379
      DB_ASIA: redis-asia:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: lab
      RabbitMq__Password: lab
    depends_on: *application-dependencies

  rank-calculator-2:
    build:
      context: .
      dockerfile: RankCalculator/Dockerfile
    environment: *rank-environment
    depends_on: *application-dependencies

  events-logger-1:
    build:
      context: .
      dockerfile: EventsLogger/Dockerfile
    environment: &logger-environment
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: lab
      RabbitMq__Password: lab
      InstanceId: logger-1
    depends_on:
      rabbitmq:
        condition: service_healthy

  events-logger-2:
    build:
      context: .
      dockerfile: EventsLogger/Dockerfile
    environment:
      <<: *logger-environment
      InstanceId: logger-2
    depends_on:
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - valuator-1
      - valuator-2
